name: Kominka Finder - Daily Scrape Job
on:
  schedule:
      - cron: "0 18 * * *"
        workflow_dispatch:
            inputs:
                  max_pages:
                          description: "Max pages"
                                  default: "10"
                                        skip_scoring:
                                                type: boolean
                                                        default: false
                                                        jobs:
                                                          scrape:
                                                              runs-on: ubuntu-latest
                                                                  env:
                                                                        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                                                                              SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                                                                                    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                                                                                        steps:
                                                                                              - uses: actions/checkout@v4
                                                                                                    - uses: actions/setup-python@v5
                                                                                                            with:
                                                                                                                      python-version: "3.12"
                                                                                                                                cache: "pip"
                                                                                                                                          cache-dependency-path: scraper/requirements.txt
                                                                                                                                                - run: pip install -r scraper/requirements.txt
                                                                                                                                                      - name: Cache Playwright
                                                                                                                                                              uses: actions/cache@v4
                                                                                                                                                                      with:
                                                                                                                                                                                path: ~/.cache/ms-playwright
                                                                                                                                                                                          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}
                                                                                                                                                                                                - run: playwright install chromium --with-deps
                                                                                                                                                                                                      - working-directory: scraper
                                                                                                                                                                                                              run: python run_scraper.py
                                                                                                                                                                                                                      env:
                                                                                                                                                                                                                                MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}
                                                                                                                                                                                                                                          SKIP_SCORING: ${{ github.event.inputs.skip_scoring || 'false' }}
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                            notify-on-failure:
                                                                                                                                                                                                                                                runs-on: ubuntu-latest
                                                                                                                                                                                                                                                    if: failure()
                                                                                                                                                                                                                                                        needs: scrape
                                                                                                                                                                                                                                                            steps:
                                                                                                                                                                                                                                                                  - run: echo "Failed"
                                                                                                                                                                                                                                                                  
