name: Kominka Finder — Daily Scrape Job

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages to scrape per site (default: 10)"
        required: false
        default: "10"
      skip_scoring:
        description: "Skip AI scoring step (saves Claude API cost)"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    name: Scrape & Score Listings
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}
          SKIP_SCORING: ${{ github.event.inputs.skip_scoring || 'false' }}
        run: python run_scraper.py

      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: scraper/logs/
          if-no-files-found: ignore
          retention-days: 7

  notify-on-failure:
    name: Notify on scrape failure
    needs: scrape
    runs-on: ubuntu-22.04
    if: failure()

    steps:
      - name: Post failure notice
        run: |
          echo "Scrape job failed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
