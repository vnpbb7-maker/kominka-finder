name: Manual Scrape
on:
  schedule:
      - cron: "0 18 * * *"
        workflow_dispatch:
            inputs:
                  max_pages:
                          description: "Max pages"
                                  default: "10"
                                        skip_scoring:
                                                type: boolean
                                                        default: false

                                                        jobs:
                                                          scrape:
                                                              runs-on: ubuntu-latest
                                                                  env:
                                                                        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                                                                              SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                                                                                    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                                                                                        steps:
                                                                                              - uses: actions/checkout@v4
                                                                                                    - uses: actions/setup-python@v5
                                                                                                            with:
                                                                                                                      python-version: "3.12"
                                                                                                                                cache: pip
                                                                                                                                      - name: Install dependencies
                                                                                                                                              run: |
                                                                                                                                                        python -m pip install --upgrade pip
                                                                                                                                                                  pip install -r requirements.txt
                                                                                                                                                                        - name: Run scraper
                                                                                                                                                                                run: |
                                                                                                                                                                                          python scrape_to_supabase.py --max-pages ${{ github.event.inputs.max_pages || 10 }} ${{ github.event.inputs.skip_scoring == 'true' && '--skip-scoring' || '' }}
                                                                                                                                                                                          
